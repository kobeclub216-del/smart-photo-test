<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智慧相簿 v0.03</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#20232a;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;padding:16px 16px 36px;max-width:760px;margin:auto}header{padding:25px 0 16px}h1{margin:0;font-size:29px}p{color:#737b89;font-size:13px}.panel{background:white;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #17253a0a}button,select{border:0;border-radius:12px;padding:12px;background:#edf2fc;color:#255dc4;font-size:15px;font-weight:600}input[type=file]{display:block;width:100%;font-size:16px;padding:12px;border:2px dashed #8aafe8;border-radius:12px;background:#f0f6ff;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.tile{position:relative;aspect-ratio:1;background:#e9edf2;border-radius:10px;overflow:hidden;padding:0}.tile img{width:100%;height:100%;object-fit:cover}.tile.selected{outline:4px solid #2673f2;outline-offset:-4px}.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat.active{outline:2px solid #2673f2}.count{font-size:12px;margin-top:7px}h2{font-size:18px;margin:0 0 14px}button:disabled{opacity:.4}.actions{display:flex;gap:8px;flex-wrap:wrap}#notice{color:#245bc0}</style></head><body><header><h1>智慧相簿</h1><p>照片整理測試版 · v0.03 Safari</p></header><section class="panel"><h2>匯入照片</h2><input id="picker" type="file" accept="image/*" multiple><button id="selectAll">全選目前照片</button><p>照片僅在瀏覽器內處理，不上傳、不修改原始照片。重新開啟需重新匯入。</p><p id="runtime">JavaScript 尚未啟動</p><p id="notice" role="status"></p></section><section class="panel"><h2>分類相簿</h2><div id="cats" class="cats"></div></section><section class="panel"><h2 id="galleryTitle">所有照片（0）</h2><div class="actions"><select id="moveTo" aria-label="選擇分類"></select><button id="move">將選取照片分類</button><button id="clearSelection">取消選取</button></div><div id="gallery" class="grid"></div><p id="empty">尚未匯入照片。</p></section><section class="panel"><h2>管理</h2><button id="export">匯出分類清單 JSON</button> <button id="reset">清空測試資料</button><p>手動分類測試，不含 AI 或系統相簿建立功能。</p></section><script>
const categories=['未分類','旅遊風景','美食','寵物','人物','文件截圖','其他'];let photos=[],active='全部',selected=new Set(),counter=0;const $=id=>document.getElementById(id);const visible=()=>photos.filter(p=>active==='全部'||p.category===active);function render(){const c=$('cats');c.replaceChildren();for(const x of ['全部',...categories]){const b=document.createElement('button');b.className='cat'+(active===x?' active':'');b.textContent=x+' · '+(x==='全部'?photos.length:photos.filter(p=>p.category===x).length)+' 張';b.onclick=()=>{active=x;selected.clear();render()};c.append(b)}const v=visible();$('galleryTitle').textContent=(active==='全部'?'所有照片':active)+'（'+v.length+'）';const g=$('gallery');g.replaceChildren();for(const p of v){const b=document.createElement('button');b.className='tile'+(selected.has(p.id)?' selected':'');b.setAttribute('aria-pressed',selected.has(p.id));const im=document.createElement('img');im.src=p.url;im.alt=p.name;im.onerror=()=>{$('notice').textContent='部分照片格式無法預覽，但仍可分類。'};b.append(im);b.onclick=()=>{selected.has(p.id)?selected.delete(p.id):selected.add(p.id);render()};g.append(b)}$('empty').hidden=!!v.length;$('move').disabled=!selected.size;$('clearSelection').disabled=!selected.size;$('notice').textContent=selected.size?'已選取 '+selected.size+' 張照片':''}
for(const x of categories){const o=document.createElement('option');o.value=o.textContent=x;$('moveTo').append(o)}
$('picker').onchange=e=>{try{let n=0;for(const f of Array.from(e.target.files||[])){if(!f.type.startsWith('image/')&&!/\.(heic|heif|jpg|jpeg|png|webp)$/i.test(f.name))continue;photos.push({id:++counter,name:f.name,category:'未分類',url:URL.createObjectURL(f)});n++}e.target.value='';active='全部';selected.clear();render();$('notice').textContent='已匯入 '+n+' 張照片'}catch(err){render();$('notice').textContent='匯入失敗：'+err.message}};
$('selectAll').onclick=()=>{visible().forEach(p=>selected.add(p.id));render()};$('clearSelection').onclick=()=>{selected.clear();render()};$('move').onclick=()=>{const cat=$('moveTo').value;photos.forEach(p=>{if(selected.has(p.id))p.category=cat});selected.clear();render();$('notice').textContent='已分類至「'+cat+'」'};$('reset').onclick=()=>{if(confirm('清空本次測試資料？不影響原始照片。')){photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];selected.clear();active='全部';render()}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({version:'0.03',photos:photos.map(p=>({name:p.name,category:p.category}))},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='smart-photo-categories.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};render();$('runtime').textContent='✓ JavaScript 已啟動';$('runtime').style.color='#16734b';</script></body></html>
