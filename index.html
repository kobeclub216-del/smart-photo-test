<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智慧相簿 v0.09-C</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#20232a;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;padding:16px 16px 36px;max-width:760px;margin:auto}header{padding:25px 0 16px}h1{margin:0;font-size:29px}p{color:#737b89;font-size:13px}.panel{background:white;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #17253a0a}button,select{border:0;border-radius:12px;padding:12px;background:#edf2fc;color:#255dc4;font-size:15px;font-weight:600}input[type=file]{display:block;width:100%;font-size:16px;padding:12px;border:2px dashed #8aafe8;border-radius:12px;background:#f0f6ff;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.tile{position:relative;aspect-ratio:1;background:#e9edf2;border-radius:10px;overflow:hidden;padding:0}.tile img{width:100%;height:100%;object-fit:cover}.tile.selected{outline:4px solid #2673f2;outline-offset:-4px}.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat.active{outline:2px solid #2673f2}.count{font-size:12px;margin-top:7px}h2{font-size:18px;margin:0 0 14px}button:disabled{opacity:.4}.actions{display:flex;gap:8px;flex-wrap:wrap}#notice{color:#245bc0}.tile .tag{position:absolute;bottom:0;left:0;right:0;background:#000a;color:white;font-size:11px;padding:4px;text-align:center}.tile img{display:block}</style></head><body><header><h1>智慧相簿</h1><p>照片整理測試版 · v0.09-C Safari</p></header><section class="panel"><h2>匯入照片</h2><input id="picker" type="file" accept="image/*" multiple><button id="selectAll">全選目前照片</button><p>照片僅在瀏覽器內處理，不上傳、不修改原始照片。測試照片以縮圖暫存在此瀏覽器，清空測試資料可移除。</p><p id="runtime">JavaScript 尚未啟動</p><p id="notice" role="status"></p></section><section class="panel"><h2>AI 智慧分類</h2><button id="ai">一鍵 AI 智慧分類</button> <button id="stop" disabled>停止</button><p><label><input type="checkbox" id="independent"> 獨立測試（重新辨識非手動分類照片，不參考舊分類）</label></p><p><label><input type="checkbox" id="fullScan"> 完整辨識模式（保留上一版全部分析步驟）</label></p><p><label>運算模式 <select id="backend"><option value="auto">自動 GPU 優先</option><option value="cpu">CPU 穩定模式</option></select></label></p><p id="aiStatus" role="status">動態快速辨識，疑難照片保留完整分析。首次需下載模型。</p><details open><summary>AI 辨識紀錄</summary><div id="aiLog" style="font-size:13px;overflow-wrap:anywhere"></div></details><progress id="aiProgress" value="0" max="1" style="width:100%"></progress></section><section class="panel"><h2>分類相簿</h2><div id="cats" class="cats"></div></section><section class="panel"><h2 id="galleryTitle">所有照片（0）</h2><div class="actions"><select id="moveTo" aria-label="選擇分類"></select><button id="move">將選取照片分類</button><button id="clearSelection">取消選取</button></div><div id="gallery" class="grid"></div><p id="empty">尚未匯入照片。</p></section><section class="panel"><h2>管理</h2><button id="export">匯出分類清單 JSON</button> <button id="reset">清空測試資料</button><p>支援 AI 與手動分類；不會建立系統相簿。</p></section><script>
const categories=['未分類','旅遊風景','美食','寵物','人物','文件截圖','其他'];let photos=[],active='全部',selected=new Set(),counter=0;const $=id=>document.getElementById(id);const visible=()=>photos.filter(p=>active==='全部'||p.category===active);function render(){const c=$('cats');c.replaceChildren();for(const x of ['全部',...categories]){const b=document.createElement('button');b.className='cat'+(active===x?' active':'');b.textContent=x+' · '+(x==='全部'?photos.length:photos.filter(p=>p.category===x).length)+' 張';b.onclick=()=>{active=x;selected.clear();render()};c.append(b)}const v=visible();$('galleryTitle').textContent=(active==='全部'?'所有照片':active)+'（'+v.length+'）';const g=$('gallery');g.replaceChildren();for(const p of v){const b=document.createElement('button');b.className='tile'+(selected.has(p.id)?' selected':'');b.setAttribute('aria-pressed',selected.has(p.id));const im=document.createElement('img');im.src=p.url;im.alt=p.name;im.onerror=()=>{$('notice').textContent='部分照片格式無法預覽，但仍可分類。'};im.loading='lazy';b.append(im);if(p.category!=='未分類'){const tag=document.createElement('span');tag.className='tag';tag.textContent=p.category+(p.source==='fusion'?' · 綜合':p.source==='foodscan'?' · 多區域':p.source==='similar'?' · 相似':p.source==='landscape'?' · 場景':p.source==='semantic'?' · 語意':p.aiScore!=null?' · '+Math.round(p.aiScore*100)+'%':'');b.append(tag);if(p.tags?.length)tag.textContent+=' · '+p.tags.filter(t=>t!==p.category).slice(0,2).join('／')}b.onclick=()=>{selected.has(p.id)?selected.delete(p.id):selected.add(p.id);render()};g.append(b)}$('empty').hidden=!!v.length;$('move').disabled=storageBusy||aiBusy||!selected.size;$('clearSelection').disabled=!selected.size;$('notice').textContent=selected.size?'已選取 '+selected.size+' 張照片':''}
for(const x of categories){const o=document.createElement('option');o.value=o.textContent=x;$('moveTo').append(o)}

let db,storageBusy=false;
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('smart-photo-test',1);q.onupgradeneeded=()=>q.result.createObjectStore('photos',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function write(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('photos',mode);const q=fn(t.objectStore('photos'));t.oncomplete=()=>resolve(q.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('儲存中斷'))})}
function save(p){return write('readwrite',o=>o.put({id:p.id,name:p.name,category:p.category,blob:p.blob,aiScore:p.aiScore,feature:p.feature,regions:p.regions,source:p.source,tags:p.tags}))}
async function thumb(f){const u=URL.createObjectURL(f);try{const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(Error('照片格式無法讀取'));im.src=u});const scale=Math.min(1,512/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(Error('縮圖失敗')),'image/jpeg',.85))}finally{URL.revokeObjectURL(u)}}
function lock(v){storageBusy=v;$('picker').disabled=v;$('ai').disabled=v;$('reset').disabled=v;$('move').disabled=v||!selected.size}
$('picker').onchange=async e=>{const files=Array.from(e.target.files||[]);lock(true);let n=0,fail=0;try{for(const f of files){try{const blob=await thumb(f);const p={id:++counter,name:f.name,category:'未分類',blob,url:URL.createObjectURL(blob)};try{await save(p)}catch(err){URL.revokeObjectURL(p.url);throw err}photos.push(p);n++}catch(err){fail++}}e.target.value='';active='全部';selected.clear();render();$('notice').textContent='已匯入並儲存 '+n+' 張；失敗 '+fail+' 張'}finally{lock(false)}};
$('selectAll').onclick=()=>{visible().forEach(p=>selected.add(p.id));render()};$('clearSelection').onclick=()=>{selected.clear();render()};$('move').onclick=async()=>{if(storageBusy||aiBusy)return;lock(true);try{const cat=$('moveTo').value;for(const p of photos){if(selected.has(p.id)){await save({...p,category:cat,aiScore:null,source:'manual',tags:[cat]});p.tags=[cat];p.category=cat;p.aiScore=null;p.source='manual'}}selected.clear();render();$('notice').textContent='已分類至「'+cat+'」'}catch(e){render();$('notice').textContent='儲存失敗：'+e.message}finally{lock(false)}};$('reset').onclick=async()=>{if(storageBusy||aiBusy)return;if(confirm('清空本次測試資料？不影響原始照片。')){lock(true);try{await write('readwrite',o=>o.clear());photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];selected.clear();active='全部';render()}catch(e){$('notice').textContent='清空失敗：'+e.message}finally{lock(false)}}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({version:'0.09-C',photos:photos.map(p=>({name:p.name,category:p.category,tags:p.tags||[]}))},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='smart-photo-categories.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};$('runtime').textContent='✓ JavaScript 已啟動';$('runtime').style.color='#16734b';
let aiBusy=false,aiStop=false,modelPromise,activeBackend=null;
async function releaseModels(){for(const promise of [modelPromise,facePromise,detectorPromise,semanticPromise]){if(promise){try{const m=await promise;if(typeof m.dispose==='function')m.dispose();else if(m.model&&typeof m.model.dispose==='function')m.model.dispose()}catch(e){}}}modelPromise=facePromise=detectorPromise=semanticPromise=null}
async function chooseBackend(preference){const tf=window.tf;if(activeBackend===preference&&tf.getBackend())return;await releaseModels();let backend='cpu';if(preference!=='cpu'){try{if(!await tf.setBackend('webgl'))throw Error('WebGL 不可用');await tf.ready();const t=tf.tidy(()=>tf.tensor2d([[1,2],[3,4]]).matMul(tf.tensor2d([[1],[2]])));try{const v=await t.data();if(v[0]!==5||v[1]!==11)throw Error('GPU 驗證失敗')}finally{t.dispose()}backend='webgl'}catch(e){logAI('GPU 初始化失敗，改用 CPU：'+e.message)}}if(backend==='cpu'){await tf.setBackend('cpu');await tf.ready()}activeBackend=preference;logAI('運算後端：'+tf.getBackend())}
function logAI(t){const p=document.createElement('p');p.textContent=t;$('aiLog').append(p)}
function loadScript(url,ready){if(ready())return Promise.resolve();return new Promise((ok,no)=>{const tag=document.createElement('script');tag.src=url;const timer=setTimeout(()=>{tag.remove();no(Error('下載逾時：'+url))},90000);tag.onload=()=>{clearTimeout(timer);ready()?ok():no(Error('套件未初始化'))};tag.onerror=()=>{clearTimeout(timer);tag.remove();no(Error('套件下載失敗：'+url))};document.head.append(tag)})}

function mapLabel(s){s=s.toLowerCase();if(/\b(bread|breadstick|toast|croissant|baguette|brioche|bun|roll|pretzel|bagel|loaf|muffin|scone|pastry|danish|doughnut|donut|biscuit|cracker|wafer|pancake|waffle|bakery|bakeshop|patisserie|confectionery|cake|cupcake|tart|pie)\b/.test(s)&&!/\b(toaster|breadbox|rolling pin|toilet roll)\b/.test(s))return '美食';if(/\b(dog|terrier|retriever|shepherd|poodle|cat|kitten|tabby|persian cat|siamese|hamster|rabbit|goldfish|parrot|chihuahua|pug|beagle|spaniel|husky|shih-tzu|malamute|dachshund|collie|schnauzer|pinscher|rottweiler|papillon|pekinese|basset|bloodhound|whippet|boxer|chow|samoyed|pomeranian|leonberg|newfoundland|egyptian cat|tiger cat)\b/.test(s))return '寵物';if(/\b(pizza|burger|cheeseburger|hotdog|sandwich|ice cream|pretzel|bagel|burrito|guacamole|soup|spaghetti|carbonara|meat loaf|plate|espresso|coffee|banana|orange|pineapple|strawberry|broccoli|cauliflower|chocolate sauce|trifle|French loaf|french loaf|bakery|dough|mashed potato|potpie|consomme|noodle|rice|dumpling|cake|cookie|waffle|omelet|fig|lemon|pomegranate|cucumber|mushroom)\b/.test(s))return '美食';if(/\b(lakeside|seashore|sandbar|valley|volcano|alp|mountain|cliff|coral reef|castle|palace|monastery|church|mosque|viaduct|promontory|geyser|fountain|cliff dwelling|barn|boathouse|lighthouse|ruin|megalith|obelisk|triumphal arch|stone wall|fortress|stupa|pagoda)\b/.test(s))return '旅遊風景';if(/\b(book jacket|comic book|crossword puzzle|envelope|menu|web site|website)\b/.test(s))return '文件截圖';if(/\b(groom|bridegroom|ballplayer|scuba diver)\b/.test(s))return '人物';return null}
let semanticPromise;
async function getSemantic(){if(!semanticPromise)semanticPromise=(async()=>{await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/deeplab@0.2.2/dist/deeplab.min.js',()=>window.deeplab);return window.deeplab.load({base:'ade20k',quantizationBytes:1})})().catch(e=>{semanticPromise=null;throw e});return semanticPromise}
function semanticDecision(counts){const sum=names=>names.reduce((a,n)=>a+(counts[n]||0),0);const sky=sum(['sky']);const nature=sum(['tree','grass','mountain','hill','plant','field','earth','rock','sand','water','sea','river','land']);const built=sum(['building','house','tower','bridge','road','wall','skyscraper','path']);if(sky>=.08&&nature+built>=.20&&(nature>=.10||built>=.15))return '旅遊風景';if(nature>=.55&&sum(['tree','grass','mountain','hill','field','sea','river','water'])>=.30)return '旅遊風景';return null}
async function semanticScene(im){const model=await getSemantic();const result=await model.segment(im);const palette=new Map(Object.entries(result.legend).map(([name,rgb])=>[rgb.slice(0,3).join(','),name.toLowerCase().trim()]));const pixels=result.segmentationMap;const counts={};for(let i=0;i<pixels.length;i+=4){const name=palette.get([pixels[i],pixels[i+1],pixels[i+2]].join(','));if(name)counts[name]=(counts[name]||0)+4/pixels.length}logAI('語意場景：'+Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>k+' '+Math.round(v*100)+'%').join('、'));return {category:semanticDecision(counts),counts}}
let detectorPromise;
async function getDetector(){if(!detectorPromise)detectorPromise=(async()=>{await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js',()=>window.cocoSsd);return window.cocoSsd.load({base:'lite_mobilenet_v2'})})().catch(e=>{detectorPromise=null;throw e});return detectorPromise}
function landscapeEvidence(im){const c=document.createElement('canvas');c.width=96;c.height=96;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,96,96);const d=ctx.getImageData(0,0,96,96).data;let sky=0,green=0,cloud=0;for(let y=0;y<96;y++)for(let x=0;x<96;x++){const i=(y*96+x)*4,r=d[i],g=d[i+1],b=d[i+2];if(y<45&&b>100&&b>r*1.12&&b>=g*1.03)sky++;if(y<45&&Math.max(r,g,b)-Math.min(r,g,b)<28&&r>155&&g>155&&b>155)cloud++;if(y>=35&&g>r*1.10&&g>b*1.12&&g>40)green++}return {sky:sky/(96*45),cloud:cloud/(96*45),green:green/(96*61)}}
let facePromise;
async function getFaceModel(){if(!facePromise)facePromise=(async()=>{await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.1.0/dist/blazeface.min.js',()=>window.blazeface);return window.blazeface.load({maxFaces:5})})().catch(e=>{facePromise=null;throw e});return facePromise}

async function loadImage(p){const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(Error('照片讀取失敗'));im.src=p.url});return im}
async function featureFor(model,p,im){if(Array.isArray(p.feature)&&p.feature.length)return p.feature;const t=model.infer(im||await loadImage(p),true);try{const v=Array.from(await t.data());const norm=Math.sqrt(v.reduce((a,b)=>a+b*b,0));if(!norm)throw Error('特徵為空');const feature=v.map(x=>x/norm);await save({...p,feature});p.feature=feature;return feature}finally{t.dispose()}}
function similarCategory(v,refs){const scores={};for(const p of refs){if(!p.feature||p.feature.length!==v.length)continue;const sim=v.reduce((a,x,i)=>a+x*p.feature[i],0);scores[p.category]=Math.max(scores[p.category]||0,sim)}const rank=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const top=rank[0];return top&&top[1]>=0.90&&top[1]-(rank[1]?.[1]||0)>=0.06?top:null}
async function regionsFor(model,p,im){if(p.regions?.length)return p.regions;im=im||await loadImage(p);const out=[await featureFor(model,p,im)];for(const [x,y] of [[0,0],[.35,0],[0,.35],[.35,.35]]){const c=document.createElement('canvas');c.width=c.height=224;c.getContext('2d').drawImage(im,im.width*x,im.height*y,im.width*.65,im.height*.65,0,0,224,224);const t=model.infer(c,true);try{const v=Array.from(await t.data());const n=Math.hypot(...v);if(n)out.push(v.map(x=>x/n))}finally{t.dispose();c.width=c.height=1}}await save({...p,regions:out});p.regions=out;return out}
function regionMatch(v,refs){const scores={};for(const p of refs){if(!p.regions?.length)continue;const dot=(a,b)=>a.reduce((n,x,i)=>n+x*b[i],0);const matches=v.map(a=>Math.max(...p.regions.map(b=>dot(a,b)))).sort((a,b)=>b-a);const score=(matches[0]+matches[1]+matches[2])/3;scores[p.category]=Math.max(scores[p.category]||0,score)}const rank=Object.entries(scores).sort((a,b)=>b[1]-a[1]);return rank[0]&&rank[0][1]>=.87&&rank[0][1]-(rank[1]?.[1]||0)>=.05?rank[0]:null}
async function sceneScores(model,im,whole){const scores={};const views=[im];if(im.width>=120&&im.height>=120){for(const [x,y] of [[0,0.35],[0.35,0.35]]){const c=document.createElement('canvas');c.width=c.height=224;c.getContext('2d').drawImage(im,im.width*x,im.height*y,im.width*.65,im.height*.65,0,0,224,224);views.push(c)}}for(const view of views){const local={};for(const item of (view===im&&whole?whole:await model.classify(view,12))){const c=mapLabel(item.className);if(c)local[c]=(local[c]||0)+item.probability}for(const c in local)scores[c]=(scores[c]||0)+local[c]/views.length;if(view!==im)view.width=view.height=1}return Object.entries(scores).sort((a,b)=>b[1]-a[1])}
function foodEvidence(items){let food=0,other=0;for(const item of items){const c=mapLabel(item.className);if(c==='美食')food+=item.probability;else if(c)other=Math.max(other,item.probability)}return {food,other}}
async function foodScan(model,im,whole){const views=[whole];for(const [x,y,w] of [[.15,.15,.7],[0,0,.6],[.4,0,.6],[0,.4,.6],[.4,.4,.6]]){if(aiStop)return null;const c=document.createElement('canvas');c.width=c.height=224;ctxDraw(c,im,x,y,w);views.push(await model.classify(c,20));c.width=c.height=1;await new Promise(r=>setTimeout(r,0))}const evidence=views.map(foodEvidence);const strong=evidence.filter(e=>e.food>=.30&&e.food>e.other+.12);const moderate=evidence.filter(e=>e.food>=.18&&e.food>e.other+.08);const peak=Math.max(...evidence.map(e=>e.food));logAI('食品局部分析：'+views.map((v,i)=>'區域'+i+' '+v.slice(0,3).map(t=>t.className+' '+Math.round(t.probability*100)+'%').join('/')).join('；'));return (strong.length>=2||(peak>=.65&&moderate.length>=2)||moderate.length>=3)?peak:null}
function ctxDraw(c,im,x,y,w){c.getContext('2d').drawImage(im,im.width*x,im.height*y,im.width*w,im.height*w,0,0,224,224)}
function fastDecision(e){if(e.full)return false;if(e.source==='person'||e.source==='face')return e.score>=.85;if(!e.personChecked||!e.faceChecked)return false;return e.source==='object'&&e.cat==='寵物'&&e.score>=.90&&e.best?.[0]==='寵物'&&e.best[1]>=.65&&e.margin>=.40}
function fuseEvidence(e){const scores={};const tags=new Set();function add(c,v){if(c&&v>0){scores[c]=(scores[c]||0)+v;if(v>=.18)tags.add(c)}}for(const [c,v] of Object.entries(e.whole||{}))add(c,v*.65);for(const [c,v] of e.scene||[])add(c,v*.65);if(e.food!=null)add('美食',.38+e.food*.25);if(e.semantic){add(e.semantic.category,.48);const a=e.semantic.counts||{};if((a.food||0)+(a['food, solid food']||0)>=.04){add('美食',.55);tags.add('食品')}if((a.sky||0)>.08)tags.add('天空');if((a.tree||0)>.12)tags.add('樹木')}if(e.match)add(e.match[0],.35);if(e.object)add(e.object,.75);if(e.person){tags.add('人物');return {cat:'人物',tags:[...tags],scores}}const rank=Object.entries(scores).sort((a,b)=>b[1]-a[1]);return {cat:rank[0]&&rank[0][1]>=.32&&rank[0][1]-(rank[1]?.[1]||0)>=.09?rank[0][0]:null,tags:[...tags],scores}}
const labels=['a photo of a person or group of people','a photo of food or drinks','a photo of a landscape, scenery or architecture','a photo of a pet or animal','a screenshot or a photo of a document','a photo of an object or something else'];
const groups=['人物','美食','旅遊風景','寵物','文件截圖','其他'];
$('stop').onclick=()=>{aiStop=true;$('aiStatus').textContent='正在停止，請稍候…'};
$('ai').onclick=async()=>{if(aiBusy||storageBusy)return;const independent=$('independent').checked;const fullScan=$('fullScan').checked;const started=performance.now();let fastCount=0,deepCount=0;const batch=photos.filter(p=>p.category==='未分類'||(independent&&p.source!=='manual'&&p.source!=null));if(!batch.length){$('aiStatus').textContent='沒有未分類照片，請先匯入。';return}aiBusy=true;aiStop=false;$('backend').disabled=true;$('move').disabled=true;$('ai').disabled=true;$('stop').disabled=false;$('picker').disabled=true;$('reset').disabled=true;$('aiLog').replaceChildren();let done=0,assigned=0,failed=0;$('aiProgress').max=batch.length;$('aiProgress').value=0;
try{$('aiStatus').textContent='正在載入 AI 模型，首次可能需要數分鐘…';
await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',()=>window.tf);await chooseBackend($('backend').value);if(!modelPromise)modelPromise=(async()=>{logAI('TensorFlow 已啟動：'+window.tf.getBackend());await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js',()=>window.mobilenet);logAI('正在下載 MobileNet 權重');const m=await window.mobilenet.load({version:1,alpha:0.25});logAI('模型載入成功');return m})().catch(e=>{modelPromise=null;throw e});
let model;try{model=await modelPromise}catch(e){if(window.tf.getBackend()!=='webgl')throw e;logAI('GPU 模型載入失敗，切回 CPU');await chooseBackend('cpu');$('backend').value='cpu';modelPromise=window.mobilenet.load({version:1,alpha:0.25});model=await modelPromise}logAI('模型就緒，開始逐張辨識');let face=null;try{face=await getFaceModel();logAI('人物臉部偵測模型就緒')}catch(e){logAI('人物模型未載入，其他分類仍可使用：'+e.message)}
let detector=null;try{if(!aiStop){$('aiStatus').textContent='載入人體與物件偵測模型…';detector=await getDetector();logAI('人體偵測模型就緒')}}catch(e){logAI('人體模型未載入：'+e.message)}
const refs=independent?[]:photos.filter(p=>p.category!=='未分類'&&p.category!=='其他'&&p.source!=='similar').sort((a,b)=>(b.source==='manual')-(a.source==='manual')).slice(0,60);for(let i=0;i<refs.length&&!aiStop;i++){try{$('aiStatus').textContent='建立相似照片參考 '+(i+1)+' / '+refs.length;await regionsFor(model,refs[i])}catch(e){logAI('參考特徵失敗：'+e.message)}await new Promise(r=>setTimeout(r,0))}
for(const p of batch){if(aiStop)break;$('aiStatus').textContent='辨識中 '+(done+1)+' / '+batch.length;try{const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=p.url});const result=await model.classify(im,12);const scores={};for(const item of result){const c=mapLabel(item.className);if(c)scores[c]=(scores[c]||0)+item.probability}const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const best=ranked[0];let cat=best&&best[1]>=0.35&&best[1]-(ranked[1]?.[1]||0)>=0.15?best[0]:null;let score=cat?best[1]:null;let source='model';let objects=[];let personChecked=false,faceChecked=false;if(detector&&!aiStop){try{objects=await detector.detect(im,20,.35);personChecked=true;const person=objects.filter(o=>o.class==='person').sort((a,b)=>b.score-a.score)[0];if(person&&person.score>=.45){cat='人物';score=person.score;source='person'}logAI('物件偵測：'+objects.map(o=>o.class+' '+Math.round(o.score*100)+'%').join('、'))}catch(e){logAI('人體偵測失敗：'+e.message)}}if(face&&!aiStop&&(fullScan||source!=='person'||score<.85)){try{let faces=await face.estimateFaces(im,false);if(!faces.length){for(const x of [0,.5]){const c=document.createElement('canvas');c.width=224;c.height=224;c.getContext('2d').drawImage(im,im.width*x,im.height*.18,im.width*.5,im.height*.64,0,0,224,224);faces=faces.concat(await face.estimateFaces(c,false));c.width=c.height=1}}const confidence=Math.max(0,...faces.map(f=>Number(Array.isArray(f.probability)?f.probability[0]:f.probability)||0));faceChecked=true;if(confidence>=0.75){cat='人物';score=confidence;source='face'}}catch(e){logAI('人物偵測失敗：'+e.message)}}if(cat!=='人物'){const pet=objects.find(o=>['cat','dog','bird'].includes(o.class)&&o.score>=.55);const food=objects.find(o=>['banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut','cake'].includes(o.class)&&o.score>=.55);if(pet){cat='寵物';score=pet.score;source='object'}else if(food&&cat!=='寵物'){cat='美食';score=food.score;source='object'}}const evidence={whole:scores,person:cat==='人物',object:source==='object'?cat:null};if(!aiStop){const fast=fastDecision({full:fullScan,source,score,cat,personChecked,faceChecked,best,margin:(best?.[1]||0)-(ranked[1]?.[1]||0)});if(fast){fastCount++;p.tags=[...new Set([cat,...Object.entries(scores).filter(([k,v])=>v>=.35).map(([k])=>k)])];logAI('快速分類：'+cat)}else{deepCount++;try{evidence.scene=await sceneScores(model,im,result)}catch(e){logAI('區域分析失敗：'+e.message)}if(!evidence.person){try{evidence.food=await foodScan(model,im,result)}catch(e){logAI('食品分析失敗：'+e.message)}try{if(refs.length){const v=await featureFor(model,p,im);evidence.match=similarCategory(v,refs)||regionMatch(await regionsFor(model,p,im),refs)}}catch(e){logAI('相似分析失敗：'+e.message)}if(!cat||cat==='旅遊風景'){try{evidence.semantic=await semanticScene(im)}catch(e){logAI('語意模型失敗：'+e.message)}}}const fused=fuseEvidence(evidence);cat=fused.cat||cat;const tags=[...new Set([cat,...fused.tags].filter(Boolean))];p.tags=tags;if(fused.cat&&!evidence.person&&source!=='object'){source='fusion';score=null}logAI('融合證據：'+JSON.stringify(fused.scores)+'；標籤：'+tags.join('、'))}}logAI('第 '+(done+1)+' 張：'+result.map(x=>x.className+' '+Math.round(x.probability*100)+'%').join('；')+' → '+(cat||'未分類'));if(!aiStop){if(cat){await save({...p,category:cat,aiScore:score,source});p.category=cat;p.aiScore=score;p.source=source;assigned++}else if(independent){await save({...p,category:'未分類',aiScore:null,source:null,tags:[]});p.tags=[];p.category='未分類';p.aiScore=null;p.source=null}}}catch(e){failed++;logAI('第 '+(done+1)+' 張失敗：'+(e.message||String(e)));if(window.tf.getBackend()==='webgl'){aiStop=true;$('backend').value='cpu';logAI('GPU 執行異常，已選擇 CPU；再次按分類可繼續未完成照片。')}}done++;$('aiProgress').value=done;if(done%5===0)render();await new Promise(resolve=>setTimeout(resolve,0))}
render();$('aiStatus').textContent=(aiStop?'已停止':'辨識完成')+'：已處理 '+done+' 張，成功分類 '+assigned+' 張，讀取失敗 '+failed+' 張，其餘保留未分類。耗時 '+((performance.now()-started)/1000).toFixed(1)+' 秒；快速 '+fastCount+' 張、深度 '+deepCount+' 張；運算 '+window.tf.getBackend()+'。';
}catch(e){$('aiStatus').textContent='AI 載入或執行失敗：'+e.message+'。仍可手動分類，請確認網路後重試。'}finally{aiBusy=false;$('backend').disabled=false;render();$('ai').disabled=false;$('stop').disabled=true;$('picker').disabled=false;$('reset').disabled=false}};

// Restore before enabling import or AI.
lock(true);(async()=>{try{db=await openDB();const rows=await write('readonly',o=>o.getAll());photos=rows.map(p=>({...p,url:URL.createObjectURL(p.blob)}));counter=photos.reduce((n,p)=>Math.max(n,p.id),0);render();lock(false);$('notice').textContent='已恢復 '+photos.length+' 張本機照片'}catch(e){$('notice').textContent='本機儲存無法使用：'+e.message+'。請以 Safari 開啟。'}})();
</script></body></html>
